[project]
name = "amazon-cart"
version = "0.1.0"
description = "Amazon product search and add-to-cart API for Muse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Asper" }]
requires-python = ">=3.11"
dependencies = [
  "curl_cffi>=0.13.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
]

[project.scripts]
amazon-cart = "amazon_cart.__main__:main"

[project.urls]
Homepage = "https://github.com/aasper03/muse-amazon-bypass"
Repository = "https://github.com/aasper03/muse-amazon-bypass"
Changelog = "https://github.com/aasper03/muse-amazon-bypass/releases"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amazon_cart*"]
